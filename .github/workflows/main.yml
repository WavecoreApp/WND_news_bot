name: News Auto-Parsing

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: news-auto-parsing
  cancel-in-progress: false

jobs:
  run-news-bot:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install libraries
        run: |
          pip install -r requirements.txt

      - name: Run news bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}

          TELEGRAM_CHANNEL_ID: ${{ vars.TELEGRAM_CHANNEL_ID }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GROQ_REWRITE_MODEL: ${{ vars.GROQ_REWRITE_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}

          TOP_PERCENT_PER_SOURCE: ${{ vars.TOP_PERCENT_PER_SOURCE }}
          SOURCE_MIN_TAKE: ${{ vars.SOURCE_MIN_TAKE }}

          MAX_NEWS_PER_RUN: ${{ vars.MAX_NEWS_PER_RUN }}
          MAX_CANDIDATES_PER_SOURCE: ${{ vars.MAX_CANDIDATES_PER_SOURCE }}
          ENTRIES_PER_SOURCE: ${{ vars.ENTRIES_PER_SOURCE }}

          GROQ_BATCH_SIZE: ${{ vars.GROQ_BATCH_SIZE }}
          GROQ_REWRITE_BATCH_SIZE: ${{ vars.GROQ_REWRITE_BATCH_SIZE }}
          GEMINI_REWRITE_BATCH_SIZE: ${{ vars.GEMINI_REWRITE_BATCH_SIZE }}
          GEMINI_BATCH_DELAY_SECONDS: ${{ vars.GEMINI_BATCH_DELAY_SECONDS }}

          POST_DELAY_MIN_SECONDS: ${{ vars.POST_DELAY_MIN_SECONDS }}
          POST_DELAY_MAX_SECONDS: ${{ vars.POST_DELAY_MAX_SECONDS }}

          MAX_POSTS_PER_DOMAIN: ${{ vars.MAX_POSTS_PER_DOMAIN }}
          DIGEST_CHANNEL_URL: ${{ vars.DIGEST_CHANNEL_URL }}

        run: python bot.py

      - name: Save published URLs database
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"

          git add urls_base.txt

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update news database [skip ci]"

          git pull --rebase origin main

          git push origin HEAD:main
