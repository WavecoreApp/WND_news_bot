name: WND Digest Bot

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: wnd-digest-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-news-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Run news bot
        env:
          PYTHONUNBUFFERED: '1'

          # From repository settings (Secrets / Variables). Nothing else is read from there.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          TELEGRAM_CHANNEL_ID: ${{ vars.TELEGRAM_CHANNEL_ID || secrets.TELEGRAM_CHANNEL_ID }}
          DIGEST_CHANNEL_URL: ${{ vars.DIGEST_CHANNEL_URL }}
          MIN_SCORE_TO_POST: ${{ vars.MIN_SCORE_TO_POST }}

          # Tunables: change them here, in this file.
          MAX_POSTS_PER_RUN: '12'
          POST_DELAY_MIN_SECONDS: '30'
          POST_DELAY_MAX_SECONDS: '120'
          MAX_POSTS_PER_DOMAIN: '6'
          ENTRIES_PER_SOURCE: '25'
          # Model chains: comma-separated, tried left to right (free Flash / Flash-Lite models only).
          GEMINI_SCORE_MODELS: 'gemini-3.1-flash-lite,gemini-3.5-flash-lite,gemini-3.6-flash'
          GEMINI_REWRITE_MODELS: 'gemini-3.6-flash,gemini-3.1-flash-lite,gemini-3.8-flash'
          GROQ_FALLBACK_MODEL: 'openai/gpt-oss-120b'
        run: python bot.py

      - name: Save state.json
        if: always()
        run: |
          if [ ! -f state.json ]; then
            echo "No state.json to save"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json
          if git diff --cached --quiet; then
            echo "state.json unchanged"
            exit 0
          fi

          git commit -m "Update bot state"

          for attempt in 1 2 3 4 5; do
            # -X theirs keeps this run's state.json if the same file changed upstream.
            if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "state.json pushed"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push failed (attempt ${attempt}), retrying"
            sleep $((attempt * 5))
          done

          echo "Could not push state.json"
          exit 1
