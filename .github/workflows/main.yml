name: News Auto-Parsing

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-news-bot:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install libraries
        run: |
          pip install -r requirements.txt

      - name: Run news bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TELEGRAM_CHANNEL_ID: ${{ vars.TELEGRAM_CHANNEL_ID }}

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}

          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}

          MAX_CANDIDATES_TO_ANALYZE: ${{ vars.MAX_CANDIDATES_TO_ANALYZE }}
          MAX_NEWS_PER_RUN: ${{ vars.MAX_NEWS_PER_RUN }}
          MIN_SCORE_TO_POST: ${{ vars.MIN_SCORE_TO_POST }}

          GROQ_BATCH_SIZE: ${{ vars.GROQ_BATCH_SIZE }}
          GEMINI_REWRITE_BATCH_SIZE: ${{ vars.GEMINI_REWRITE_BATCH_SIZE }}

          POST_DELAY_MIN_SECONDS: ${{ vars.POST_DELAY_MIN_SECONDS }}
          POST_DELAY_MAX_SECONDS: ${{ vars.POST_DELAY_MAX_SECONDS }}

          MAX_POSTS_PER_DOMAIN: ${{ vars.MAX_POSTS_PER_DOMAIN }}

          DIGEST_CHANNEL_URL: ${{ vars.DIGEST_CHANNEL_URL }}

        run: python bot.py

      - name: Save published URLs database
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"

          git add urls_base.txt

          git commit -m "Update news database [skip ci]" || echo "No changes to commit"

          git push
